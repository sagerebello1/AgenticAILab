<style>

  --head:'Schibsted Grotesk',system-ui,sans-serif; --body:'Hanken Grotesk',system-ui,sans-serif; --mono:'Spline Sans Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){

    --bg:#0f1217; --surface:#171b22; --surface2:#1d222b; --ink:#eceff4; --muted:#a2aab8; --faint:#757e8c;

    --good:#4fcf9f; --good-bg:#12302a; --warn:#e5ae52; --warn-bg:#35290f; --bad:#f08080; --bad-bg:#3a1c1c;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#171b22; --surface2:#1d222b; --ink:#eceff4; --muted:#a2aab8; --faint:#757e8c;
  --line:#2a303b; --accent:#6f93ff; --accent-bg:#1c2745;
  --good:#4fcf9f; --good-bg:#12302a; --warn:#e5ae52; --warn-bg:#35290f; --bad:#f08080; --bad-bg:#3a1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:19px;font-weight:700}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400;letter-spacing:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--surface2);font-size:12.5px;color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:block}
.pill.on i{background:var(--good)}
.pill.on{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding:20px 24px 48px}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);padding:16px}.top{padding:12px 16px}}

.notice{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--accent-bg);font-size:13.5px}
.notice.err{background:var(--bad-bg)}

.list{display:flex;flex-direction:column;gap:8px;align-self:start}
.list h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;font-family:var(--body);margin:2px 4px 4px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.item:hover{border-color:var(--faint)}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .nm{font-family:var(--head);font-weight:600;font-size:15px}
.item .tk{font-size:12px;color:var(--muted);margin-left:6px}
.item .r2{color:var(--muted);font-size:13px;margin-top:2px}
.item .r3{display:flex;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tag.buy{background:var(--good-bg);color:var(--good)}

a{color:var(--accent)}

.bar{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px;margin:6px 0 4px}

<script>
/* ---------- Pricing (mirrors pricing.py) ---------- */
const VOL_PINNED_CASH = 0.12, VOL_PENDING = 0.18, STOCK_DEAL_VOL_FACTOR = 0.9;

function erf(x){
  const sign = x < 0 ? -1 : 1; x = Math.abs(x);
  if (x > 3){
    const x2 = x * x;
    const erfc = Math.exp(-x2) / (x * Math.sqrt(Math.PI)) * (1 - 1/(2*x2) + 3/(4*x2*x2) - 15/(8*x2*x2*x2));
    return sign * (1 - erfc);
  }
  let sum = 0, term = x;
  for (let n = 0; n < 80; n++){
    sum += term / (2*n + 1);
    term *= -x * x / (n + 1);
  }
  return sign * 2 / Math.sqrt(Math.PI) * sum;
}
const normCdf = x => 0.5 * (1 + erf(x / Math.SQRT2));

function blackScholes(spot, strike, years, rate, vol, kind){
  if (years <= 0 || vol <= 0){
    const disc = strike * Math.exp(-rate * Math.max(years, 0));
    return kind === 'call' ? Math.max(spot - disc, 0) : Math.max(disc - spot, 0);
  }
  const sq = Math.sqrt(years);
  const d1 = (Math.log(spot / strike) + (rate + vol * vol / 2) * years) / (vol * sq);
  const d2 = d1 - vol * sq;
  const disc = strike * Math.exp(-rate * years);
  return kind === 'call' ? spot * normCdf(d1) - disc * normCdf(d2) : disc * normCdf(-d2) - spot * normCdf(-d1);
}

function resolvedByExpiry(daysToExpiry, daysToClose){
  if (daysToClose <= 0) return 0.97;
  const q = daysToExpiry / daysToClose;
  return Math.min(0.97, Math.max(0.03, (q - 0.4) / (1.3 - 0.4)));
}

function resolvedFromCurve(curve, elapsed, extra){
  const F = d => {
    if (d <= curve[0][0]) return curve[0][1];
    for (let i = 1; i < curve.length; i++){
      if (d <= curve[i][0]) return curve[i-1][1] + (curve[i][1] - curve[i-1][1]) * (d - curve[i-1][0]) / (curve[i][0] - curve[i-1][0]);
    }
    return curve[curve.length - 1][1];
  };
  const now = F(elapsed);
  if (now >= 0.999) return 0.97;
  return Math.min(0.97, Math.max(0.03, (F(elapsed + extra) - now) / (1 - now)));
}

function scenarioValue(deal, c, p){
  const T = c.days / 365, r = c.rate, K = c.strike, kind = c.kind;
  const O = deal.offer, D = deal.downside, S0 = deal.spot, sigma = c.vol;
  const w1 = p.pClose * p.resolve, w3 = (1 - p.pClose) * p.resolve, w2 = 1 - p.resolve;
  const s1 = O * (1 + (deal.bump || 0));
  const s2 = p.pPending * O + (1 - p.pPending) * D;
  const s3 = D;
  const v1vol = deal.cash ? VOL_PINNED_CASH : sigma * STOCK_DEAL_VOL_FACTOR;
  const v1 = blackScholes(s1, K, T, r, v1vol, kind);
  const v2 = blackScholes(s2, K, T, r, VOL_PENDING, kind);
  const v3 = blackScholes(s3, K, T, r, sigma, kind);
  const fair = w1 * v1 + w2 * v2 + w3 * v3;
  const plain = blackScholes(S0, K, T, r, sigma, kind);
  let implied = null;

    '<div class="fact"><small>Gap to offer</small><b>' + (spread !== null ? spct(spread, 1) : 'n/a') + '</b></div>' +
    '<div class="fact"><small>Paid in</small><b style="font-family:var(--body)">' + ({cash:'Cash', stock:'Stock', mixed:'Cash + stock'}[s.consideration] || 'n/a') + '</b></div>';

  const ul = $('useLive'); if (ul) ul.onmousedown = e => e.preventDefault();   // keep the input focused so its blur does not re-render this link away mid-click

  if (!out){

  } else if (v === 'fair'){

  } else {
    head = 'Avoid';

  }

  // scenario cards
  $('scen').innerHTML = out.scenarios.map(sc => {
    const contrib = out.fair > 1e-9 ? sc.weight * sc.value / out.fair : 0;
    const move = (sc.spot - s.spot) / s.spot;

  $('compare').innerHTML = '<div class="cmp">' +
    bar('Market premium', s.premium, 'var(--faint)') +

      ? 'Here it is ' + (out.plain > out.fair ? 'too high' : 'too low') + ' by ' + money(Math.abs(out.plain - out.fair)) + ' because the offer price caps or anchors where the stock can go.'
      : 'Here it lands close to the deal-adjusted value.') + '</p>';
}

function ladder(s, out, kind){
  const [a, b, c] = out.scenarios;
  const pts = [
    {x:c.spot, name:'Deal breaks', col:'var(--bad)'},
    {x:b.spot, name:'Unresolved', col:'#c88a1a'},
    {x:s.spot, name:'Today', col:'var(--ink)'},
    {x:a.spot, name:'Deal closes', col:'var(--good)'}
  ];
  const all = pts.map(p => p.x).concat([s.strike]);
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  const pad = (hi - lo) * 0.12 || hi * 0.05;
  lo -= pad; hi += pad;
  const W = 640, L = 28, R = 612, y0 = 78;
  const X = v => L + (v - lo) / (hi - lo) * (R - L);
  let g = '<svg class="ladder" viewBox="0 0 640 140" role="img" aria-label="Stock price in each outcome compared with the strike price">';
  // pays-off band
  const kx = X(s.strike);
  g += kind === 'call'
    ? '<rect x="' + kx + '" y="' + (y0 - 5) + '" width="' + Math.max(0, R - kx) + '" height="10" rx="5" fill="var(--accent-bg)"/>'
    : '<rect x="' + L + '" y="' + (y0 - 5) + '" width="' + Math.max(0, kx - L) + '" height="10" rx="5" fill="var(--accent-bg)"/>';
  g += '<line x1="' + L + '" x2="' + R + '" y1="' + y0 + '" y2="' + y0 + '" stroke="var(--line)" stroke-width="2"/>';
  g += '<line x1="' + kx + '" x2="' + kx + '" y1="14" y2="136" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  g += '<text x="' + Math.min(W - 70, Math.max(70, kx)) + '" y="11" text-anchor="middle" style="fill:var(--accent)">Strike ' + money(s.strike) + (kind === 'call' ? ' (pays above)' : ' (pays below)') + '</text>';
  const sorted = pts.slice().sort((p, q) => p.x - q.x);
  const rows = [[34, 'up'], [56, 'up'], [104, 'dn'], [126, 'dn']];   // label heights
  const lastEdge = [-1e9, -1e9, -1e9, -1e9];
  const order = [1, 2, 0, 3];                                       // prefer the rows nearest the line
  sorted.forEach(p => {
    const x = X(p.x);
    const label = p.name + ' ' + money(p.x);
    const w = label.length * 6.6 + 10;
    let left = Math.max(2, Math.min(W - w - 2, x - w / 2));
    let row = order.find(r => left > lastEdge[r] + 6);
    if (row === undefined) row = order.reduce((m, r) => lastEdge[r] < lastEdge[m] ? r : m, 0);
    lastEdge[row] = left + w;
    const ty = rows[row][0];
    g += '<line x1="' + x + '" x2="' + x + '" y1="' + (rows[row][1] === 'up' ? ty + 4 : ty - 12) + '" y2="' + y0 + '" stroke="' + p.col + '" stroke-width="1" opacity=".45"/>';
    g += '<circle cx="' + x + '" cy="' + y0 + '" r="6" fill="' + p.col + '" stroke="var(--surface)" stroke-width="2"/>';
    g += '<text x="' + (left + w / 2) + '" y="' + ty + '" text-anchor="middle"><tspan>' + p.name + ' </tspan><tspan class="v">' + money(p.x) + '</tspan></text>';
  });
  return g + '</svg>';
}

/* ---------- Live news and prices (need the local server) ---------- */
const NEWS_CFG = {"halfLife": 10.0, "cap": 1.5, "capDecisive": 4.0, "rules": [["terminat(?:es|ed|ion of)\\s+(?:the\\s+|its\\s+)?(?:merger|deal|acquisition|agreement)|calls?\\s+off|walks?\\s+away|scrap(?:s|ped)\\s+(?:the\\s+)?(?:deal|merger|acquisition)|abandon(?:s|ed)\\s+(?:the\\s+)?(?:deal|merger|acquisition)", -2.5, "Deal ended"], ["(?:ftc|doj|justice department|regulators?|cma|european commission)\\s+(?:sues?|suing|challenges?|moves? to block|blocks?|blocked)|antitrust\\s+(?:lawsuit|suit)|sues? to block", -1.3, "Regulator challenge"], ["second\\s+request", -0.5, "Second request"], ["phase\\s+(?:2|ii)|in-depth\\s+(?:investigation|probe|review)", -0.5, "Deep regulatory review"], ["(?:iss|glass lewis)\\s+(?:recommends?\\s+)?(?:against|opposes)|shareholders?\\s+(?:oppose|reject|push back|vote against)|activist.*oppos", -0.8, "Holder opposition"], ["financing\\s+(?:concerns?|doubts?|trouble|problems?)|(?:lenders?|banks?)\\s+(?:balk|pull)", -0.8, "Financing concern"], ["delay(?:s|ed)?\\s+(?:the\\s+)?(?:deal|merger|closing|acquisition)|extends?\\s+(?:the\\s+)?(?:outside date|tender offer)", -0.3, "Delay"], ["(?:receives?|received|secures?|secured|obtains?|obtained|wins?|won|gets?|got)\\s+(?:all\\s+|final\\s+)?(?:regulatory|antitrust|hsr|cfius|eu|european|china)\\s+(?:approval|clearance)|(?:cleared|approved)\\s+by\\s+(?:the\\s+)?(?:ftc|doj|european commission|cfius|samr|cma)", 0.6, "Approval received"], ["waiting\\s+period\\s+(?:has\\s+)?(?:expired|expires|ends)|early\\s+termination", 0.5, "HSR waiting period ended"], ["(?:shareholders?|stockholders?)\\s+(?:approve|approved|vote\\s+(?:in\\s+favor|to\\s+approve))|approved\\s+by\\s+(?:its\\s+)?(?:shareholders?|stockholders?)", 0.7, "Holders approved"], ["tender\\s+offer\\s+(?:expired|completed|successful|extended)|(?:majority|most)\\s+of\\s+shares\\s+tendered", 0.8, "Tender progress"], ["(?:completes?|completed|closes?|closed|finalizes?|finalized)\\s+(?:its\\s+|the\\s+)?(?:acquisition|merger|deal|takeover)", 1.5, "Deal completed"]], "rival": "rival\\s+bid|competing\\s+(?:bid|offer)|topping\\s+bid|counter-?offer|sweeten(?:s|ed)|raises?\\s+(?:its\\s+)?(?:offer|bid)|higher\\s+offer|bidding\\s+war", "dealWords": "merger|acqui|takeover|buyout|deal|tender offer|to be bought|bid|antitrust|regulator|ftc|doj|cfius"};
const NEWS_RX = NEWS_CFG.rules ? {
  rules: NEWS_CFG.rules.map(r => [new RegExp(r[0], 'i'), r[1], r[2]]),
  rival: new RegExp(NEWS_CFG.rival, 'i'), deal: new RegExp(NEWS_CFG.dealWords, 'i')
} : null;

/* Same rules and weights as news.py (they are embedded from there), so pasted headlines are scored like Yahoo ones. */
function scoreNews(items, names){
  if (!NEWS_RX) return {adjustment:0, headlines:[], flags:{}};
  const nameRx = (names || []).filter(Boolean).length ? new RegExp(names.filter(Boolean).map(n => n.split(/\s+/)[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'i') : null;
  let total = 0, rival = false; const rows = [];
  items.forEach(it => {
    if (!(NEWS_RX.deal.test(it.title) || (nameRx && nameRx.test(it.title)))) return;
    const age = it.published ? Math.max(0, (Date.now() - new Date(it.published).getTime()) / 86400000) : 30;
    const decay = Math.pow(0.5, age / NEWS_CFG.halfLife);
    const tags = []; let w = 0;
    NEWS_RX.rules.forEach(r => { if (r[0].test(it.title)){ tags.push(r[2]); w += r[1]; } });
    if (NEWS_RX.rival.test(it.title)){ rival = true; tags.push('Rival bid or higher offer'); }
    total += w * decay;
    rows.push({title:it.title, link:it.link || '', source:it.source || 'yahoo', tags, weight:Math.round(w * 100) / 100, age_days:Math.round(age * 10) / 10});
  });
  const ended = rows.some(r => r.tags.indexOf('Deal ended') >= 0), completed = rows.some(r => r.tags.indexOf('Deal completed') >= 0);
  const cap = ended || completed ? NEWS_CFG.capDecisive : NEWS_CFG.cap;
  rows.sort((x, y) => x.age_days - y.age_days);
  return {adjustment:Math.max(-cap, Math.min(cap, total)), headlines:rows.slice(0, 14), flags:{rivalBid:rival, ended, completed}};
}
function parsePasted(text){
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    let l = line.replace(/^[\s*\-•]+/, '').trim(); if (l.length < 12) return;
    let published = new Date().toISOString(), m;
    if ((m = l.match(/^(\d{4}-\d{2}-\d{2})[\sT,:\-]*/))){ published = m[1] + 'T12:00:00Z'; l = l.slice(m[0].length); }
    else if ((m = l.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[\s,:\-]*/))){ const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; published = new Date(Date.UTC(y, +m[1] - 1, +m[2], 12)).toISOString(); l = l.slice(m[0].length); }
    l = l.replace(/^\d{1,2}:\d{2}\s*(?:[AP]M)?\s*[\-:]?\s*/i, '').trim();
    if (l.length >= 12) out.push({title:l, link:'', published, source:'pasted'});
  });
  return out;
}
function rescoreNews(d){
  const s = STATE[d.id], seen = {}, items = [];
  (s.newsItems || []).concat(s.pasted || []).forEach(it => { const k = it.title.toLowerCase().replace(/\W+/g, ' ').trim(); if (!seen[k]){ seen[k] = 1; items.push(it); } });
  s.news = scoreNews(items, [d.target, d.acquirer]);
  applyNews(d);
}
async function fetchNews(d){
  const s = STATE[d.id];
  if (!STATUS.server || !d.ticker || d.source === 'sample'){ s.newsItems = s.newsItems || []; return; }
  try{
    const q = '/api/news?ticker=' + encodeURIComponent(d.ticker) + '&name=' + encodeURIComponent(d.target) + '&acquirer=' + encodeURIComponent(d.acquirer || '');
    const r = await getJson(q, 25000);
    if (r.error){ s.newsErr = r.error; s.newsItems = s.newsItems || []; }
    else { s.newsErr = null; s.newsItems = (r.items || []).map(i => Object.assign({source:'yahoo'}, i)); s.newsAt = new Date(); }
  }catch(e){ s.newsErr = 'Could not load headlines from Yahoo Finance.'; s.newsItems = s.newsItems || []; }
  rescoreNews(d);
}
function ensureNews(d){ const s = STATE[d.id]; if (s.newsItems !== undefined) return null; if (!s.newsPending) s.newsPending = fetchNews(d); return s.newsPending; }

function paintNews(d){

  renderNews(d);
}
function applyNews(d){
  const s = STATE[d.id], r = s.news;
  if (!r) return;
  s.newsAdj = r.adjustment || 0;
  if (!s.pCloseManual && s.pBase > 0 && s.pBase < 1){
    s.pClose = Math.min(0.995, Math.max(0.01, sigm(logit(s.pBase) + s.newsAdj)));
    if (SELECTED === d.id && $('detail') && $('sv_pClose')){ syncInputs(); paint(); }
    paintList();
  }
}
function renderNews(d){
  const s = STATE[d.id], r = s.news || scoreNews([], []), box = $('newscard'); if (!box) return;
  let flags = '';
  if (r.flags.ended) flags += '<div class="notice err">A headline says this deal may have ended. The odds have been cut sharply. Confirm in the filings before trading.</div>';

  if (r.flags.rivalBid) flags += '<div class="notice">A headline mentions a rival or higher bid. If it is real, raise "Extra pop above the offer".</div>';
  const items = r.headlines.map(h => '<li><span class="dl ' + (h.weight > 0 ? 'up' : h.weight < 0 ? 'down' : 'zero') + '">' + (h.weight ? (h.weight > 0 ? '+' : '') + h.weight.toFixed(1) : 'none') + '</span><div>' +
    (h.link ? '<a href="' + esc(h.link) + '" target="_blank" rel="noopener">' + esc(h.title) + '</a>' : esc(h.title)) +
    '<small>' + (h.source === 'pasted' ? 'pasted by you' : (h.source && h.source !== 'yahoo' ? esc(h.source) : 'Yahoo Finance')) + ' &middot; ' + (h.age_days < 1 ? 'today' : h.age_days + ' days ago') + (h.tags.length ? ' &middot; ' + esc(h.tags.join(', ')) : '') + '</small></div></li>').join('');
  const live = STATUS.server && d.source !== 'sample' && d.ticker;
  const src = (live ? (s.newsErr ? esc(s.newsErr) : (STATUS.live && STATUS.live.source === 'finnhub' ? 'Yahoo Finance and Finnhub headlines' : 'Yahoo Finance headlines') + (s.newsAt ? ' fetched at ' + s.newsAt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '')) : (d.source === 'sample' ? 'Sample companies are fictional, so there is no feed to read.' : 'The Yahoo feed needs the local server.')) +
    ((s.pasted || []).length ? ' plus ' + s.pasted.length + ' headline' + (s.pasted.length === 1 ? '' : 's') + ' you pasted.' : '.');
  const moved = s.pBase !== null && s.pBase !== undefined ? ' Close odds started at ' + pct(s.pBase, 1) + ' from the filing' + (s.pCloseManual ? ' and you set them yourself, so the news is shown but not applied.' : ' and are ' + pct(s.pClose, 1) + ' after the news.') : '';
  box.innerHTML = '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h3>Live news</h3>' + (live ? '<button class="btn" id="newsRefresh" type="button">Refresh</button>' : '') + '</div>' + flags +
    '<p class="sub">' + src + (r.headlines.length ? moved : ' No headlines about a deal or regulators were found.') + ' Headline weights are hand-set judgments, not trained.</p>' +
    (items ? '<ul class="drv">' + items + '</ul>' : '') +
    '<details style="margin-top:10px"' + ((s.pasted && s.pasted.length) || s.pastedText ? ' open' : '') + '><summary>Add headlines from Bloomberg or anywhere else</summary><p class="sub">Bloomberg Terminal has no feed this tool can read on its own. Copy headlines from the terminal (or any news site), paste them here one per line, optionally starting with a date like 2026-10-12, and they are scored with the same rules.</p>' +
    '<textarea id="newsPaste" rows="4" placeholder="2026-10-12 FTC issues second request on Halcyon deal for Marrow\n2026-10-14 Marrow shareholders approve merger">' + esc((s.pastedText || '')) + '</textarea>' +
    '<div style="display:flex;gap:8px"><button class="btn" id="newsScore" type="button">Score these headlines</button><button class="btn" id="newsClear" type="button">Clear</button></div></details>';
  const rf = $('newsRefresh'); if (rf) rf.addEventListener('click', async () => { rf.disabled = true; rf.textContent = 'Refreshing...'; s.newsItems = undefined; s.newsPending = null; await ensureNews(d); renderNews(d); if (typeof schedulePF === 'function' && pfReady) schedulePF(0); });
  $('newsScore').addEventListener('click', () => { s.pastedText = $('newsPaste').value; s.pasted = parsePasted(s.pastedText); rescoreNews(d); renderNews(d); if (pfReady) schedulePF(0); });

}
async function pullMarket(d){

/* ---------- Agent read ---------- */
function paintAgent(d){
  const flags = d.flags || {};
  const chips = [];
  if (flags.hsr) chips.push('US antitrust review (HSR)');
  if (flags.secondRequest) chips.push('Second request');
  (flags.foreign || []).forEach(x => chips.push(x));
  (flags.other || []).forEach(x => chips.push(x));
  if (flags.financingCondition === true) chips.push('Financing condition');
  if (flags.financingCondition === false) chips.push('No financing condition');
  if (flags.tender) chips.push('Tender offer');
  if (flags.vote) chips.push('Shareholder vote');
  if (flags.goShop) chips.push('Go-shop');
  (flags.termFees || []).forEach(x => chips.push('Break fee ' + x));
  const drivers = (d.drivers || []).map(x => {
    const cls = x.delta > 0 ? 'up' : x.delta < 0 ? 'down' : 'zero';
    const txt = x.delta === 0 ? 'start' : (x.delta > 0 ? '+' : '-') + Math.abs(x.delta * 100).toFixed(0) + ' pts';
    return '<li><span class="dl ' + cls + '">' + txt + '</span><div>' + esc(x.label) + (x.note ? '<small>' + esc(x.note) + '</small>' : '') + '</div></li>';
  }).join('');

<script>
/* ===== Portfolio maths (no page code in this block) ===== */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gaussian(rng){ let u = 0, v = 0; while (u === 0) u = rng(); while (v === 0) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
function sd(a){ if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); }
function quantile(sorted, q){ const i = q * (sorted.length - 1), lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); }

/* Ordinary least squares of y on x. Returns daily alpha and beta with standard errors. */
function olsFit(y, x){
  const n = Math.min(y.length, x.length);
  if (n < 10) return null;
  const mx = mean(x.slice(0, n)), my = mean(y.slice(0, n));
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++){ const dx = x[i] - mx, dy = y[i] - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
  if (sxx <= 0) return null;
  const beta = sxy / sxx, alpha = my - beta * mx;
  let sse = 0;
  for (let i = 0; i < n; i++){ const e = y[i] - alpha - beta * x[i]; sse += e * e; }
  const s2 = sse / (n - 2);
  const seBeta = Math.sqrt(s2 / sxx), seAlpha = Math.sqrt(s2 * (1 / n + mx * mx / sxx));
  return {n, alpha, beta, seAlpha, seBeta, r2: syy > 0 ? 1 - sse / syy : 0, resSd: Math.sqrt(s2)};
}

/* Black-Scholes delta by a small bump (uses blackScholes from the deal sheet) */
function bsDelta(S, K, T, r, vol, kind){
  const h = S * 0.005;
  return (blackScholes(S + h, K, T, r, vol, kind) - blackScholes(S - h, K, T, r, vol, kind)) / (2 * h);
}

/* Build a made-up price history so the sample portfolio works with no network. Clearly labelled in the page. */
function simulateHistory(specs, n, seed){
  const rng = mulberry32(seed), dailyM = 0.16 / Math.sqrt(252);
  const raw = []; for (let i = 0; i < n; i++) raw.push(gaussian(rng) * dailyM);
  const rm = mean(raw), mk = raw.map(v => v - rm + 0.0004);          // market: fixed average, random path
  const closes = {}; let p = 400;
  closes.SPY = mk.map(r => (p *= 1 + r));
  Object.keys(specs).forEach(k => {
    const s = specs[k], e0 = []; for (let i = 0; i < n; i++) e0.push(gaussian(rng) * s.idio / Math.sqrt(252));
    const em = mean(e0); let c = 100; const arr = [];            // stock-specific noise averages to zero, so measured alpha stays near the one set here
    for (let t = 0; t < n; t++) arr.push(c *= 1 + (s.alpha || 0) / 252 + s.beta * mk[t] + e0[t] - em);
    const scale = s.price / arr[n - 1];
    closes[k] = arr.map(v => v * scale);
  });
  const dates = [], d = new Date();
  while (dates.length < n){ d.setDate(d.getDate() - 1); const wd = d.getDay(); if (wd !== 0 && wd !== 6) dates.unshift(d.toISOString().slice(0, 10)); }
  return {dates, closes};
}

function dailyReturns(closes){ const r = []; for (let i = 1; i < closes.length; i++) r.push(closes[i] / closes[i - 1] - 1); return r; }

/*
 inputs:
   positions: [{key,kind:'stock'|'call'|'put'|'cash', qty, S, K, days, mult, optPrice, underlying, beta, resSd, vol, deal}]
   deal (optional): {offer, downside, spot, cash, bump, pClose, resolve, pPending}
   mkt: {sigma (annual), rf, erp}, horizonDays, corr, nPaths, seed
 Returns the distribution of portfolio returns over the horizon.
*/
function simulatePortfolio(inp){
  const rng = mulberry32(inp.seed || 12345), h = inp.horizonDays / 365, N = inp.nPaths || 4000;
  const rf = inp.mkt.rf, erp = inp.mkt.erp, sigM = inp.mkt.sigma;
  const rho = Math.min(0.9, Math.max(0, inp.corr)), sr = Math.sqrt(rho), si = Math.sqrt(1 - rho);
  const V0 = inp.positions.reduce((s, p) => s + p.value0, 0);
  const rets = new Float64Array(N);
  let anyBreak = 0;
  for (let i = 0; i < N; i++){
    const zm = gaussian(rng);
    const mret = (rf + erp) * h + sigM * Math.sqrt(h) * zm;           // market return over the horizon
    const shared = {};                                                  // one draw per underlying so stock and option agree
    let V = 0, broke = false;
    for (const p of inp.positions){
      if (p.kind === 'cash'){ V += p.qty * (1 + rf * h); continue; }
      let st = shared[p.underlying];
      if (!st){
        const z = gaussian(rng), eps = p.resSd * Math.sqrt(252 * h) * z;
        const normalRet = rf * h + p.beta * (mret - rf * h) + eps;
        st = {normalRet, z};
        if (p.deal){
          const d = p.deal, e2 = gaussian(rng);
          const u = normCdf(sr * zm + si * e2);                          // low u means bad for the deal
          const w3 = (1 - d.pClose) * d.resolve, w2 = 1 - d.resolve;
          if (u < w3){ st.scn = 'break'; st.S = d.downside * Math.max(0.05, 1 + normalRet); broke = true; }
          else if (u < w3 + w2){ st.scn = 'pending'; st.S = d.s2 * Math.exp(VOL_PENDING * Math.sqrt(h) * z - 0.5 * VOL_PENDING * VOL_PENDING * h); }
          else { st.scn = 'close'; st.S = d.offer * (1 + (d.bump || 0)); }
        } else { st.S = p.S * Math.max(0.05, 1 + normalRet); }
        shared[p.underlying] = st;
      }
      if (st.scn === 'break') broke = true;
      if (p.kind === 'stock'){ V += p.qty * st.S; continue; }
      const Trem = p.days / 365 - h;
      let vol = p.vol;
      if (p.deal){ vol = st.scn === 'close' ? (p.deal.cash ? VOL_PINNED_CASH : p.vol * STOCK_DEAL_VOL_FACTOR) : st.scn === 'pending' ? VOL_PENDING : p.vol; }
      V += p.qty * p.mult * blackScholes(st.S, p.K, Math.max(Trem, 0), rf, vol, p.kind);
    }
    if (broke) anyBreak++;
    rets[i] = V / V0 - 1;
  }
  const sorted = Float64Array.from(rets).sort();
  const var95 = -quantile(sorted, 0.05);
  const tail = Array.from(sorted).slice(0, Math.max(1, Math.floor(N * 0.05)));
  return {rets: sorted, mean: mean(Array.from(sorted)), sd: sd(Array.from(sorted)), var95, cvar95: -mean(tail), pBreakAny: anyBreak / N, V0};
}

    if (raw){ const o = JSON.parse(raw); if (o.holdings && o.holdings.length){ PF.holdings = o.holdings; PF.prefs = Object.assign(PF.prefs, o.prefs || {}); PF.isSample = !!o.isSample; PF.rowId = 1 + Math.max.apply(null, PF.holdings.map(h => h.id || 0)); return; } }
  }catch(e){}
  PF.holdings = sampleHoldings();
}

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === '\t' || c === ';'){ row.push(cur.trim()); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur.trim()); cur = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur.trim()); if (row.some(x => x !== '')) rows.push(row);
  return rows;
}
const ALIAS = {ticker:['ticker','symbol','underlying','stock'], type:['type','kind','asset','assetclass','class','instrument'], qty:['quantity','qty','shares','contracts','units','position','amount'],
  strike:['strike','strikeprice'], expiry:['expiry','expiration','expirationdate','expirydate','days','dte','daystoexpiry'], price:['price','premium','mark','last'], beta:['beta']};
function colIndex(header){
  const norm = header.map(h => h.toLowerCase().replace(/[^a-z]/g, '')), idx = {};
  Object.keys(ALIAS).forEach(k => { idx[k] = norm.findIndex(h => ALIAS[k].indexOf(h) >= 0); });
  return idx;
}
function parseHoldings(text){
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('The file needs a header row and at least one holding.');
  const idx = colIndex(rows[0]);
  if (idx.ticker < 0 || idx.qty < 0) throw new Error('Could not find a ticker column and a quantity column. Use the template headers: ticker,type,quantity,strike,expiry,price,beta.');
  const out = [];
  rows.slice(1).forEach(r => {
    const ticker = (r[idx.ticker] || '').toUpperCase().replace(/\s/g, '');
    const qty = parseFloat((r[idx.qty] || '').replace(/[$,]/g, ''));
    if (!ticker || !isFinite(qty)) return;
    let t = idx.type >= 0 ? (r[idx.type] || '').toLowerCase() : '';
    let type = /^c(all)?$/.test(t) ? 'call' : /^p(ut)?$/.test(t) ? 'put' : /cash|money/.test(t) || ticker === 'CASH' ? 'cash' : 'stock';
    let days = null;
    if (idx.expiry >= 0 && r[idx.expiry]){
      const v = r[idx.expiry];
      if (/^\d+$/.test(v)) days = parseInt(v, 10);
      else { const d = new Date(v); if (!isNaN(d)) days = Math.max(1, Math.round((d - Date.now()) / 86400000)); }
    }
    const pf = k => idx[k] >= 0 && r[idx[k]] !== '' && isFinite(parseFloat(r[idx[k]])) ? parseFloat(r[idx[k]]) : null;
    out.push({id:PF.rowId++, ticker:type === 'cash' ? 'CASH' : ticker, type, qty, strike:pf('strike'), days, price:pf('price'), beta:pf('beta')});
  });
  if (!out.length) throw new Error('No holdings could be read from that file.');
  return out;
}
function parseHistory(text){
  const rows = parseCSV(text);
  if (rows.length < 40) throw new Error('A price history needs a header row and at least 40 dated rows.');
  const head = rows[0].map(h => h.trim());
  const cols = head.slice(1).map(h => h.toUpperCase());
  let bench = cols.find(c => ['SPY', '^GSPC', 'SPX', 'BENCHMARK', 'MARKET', 'S&P500', 'IVV', 'VOO'].indexOf(c) >= 0);
  const note = bench ? '' : ' No SPY or benchmark column was found, so the first column (' + cols[0] + ') is being used as the market.';
  bench = bench || cols[0];
  const data = rows.slice(1).map(r => ({d:r[0], v:r.slice(1).map(x => parseFloat(String(x).replace(/[$,]/g, '')))})).filter(r => r.d && !isNaN(new Date(r.d)));
  data.sort((a, b) => new Date(a.d) - new Date(b.d));
  const closes = {}, last = {};
  cols.forEach((c, j) => { closes[c] = []; last[c] = null; });
  data.forEach(r => cols.forEach((c, j) => { let v = r.v[j]; if (!isFinite(v) || v <= 0) v = last[c]; if (v !== null && v !== undefined) last[c] = v; closes[c].push(v); }));
  const start = Math.max.apply(null, cols.map(c => closes[c].findIndex(v => v !== null && v !== undefined)));
  cols.forEach(c => { closes[c] = closes[c].slice(start); });
  return {dates:data.slice(start).map(r => r.d), closes, bench, source:'upload', note};
}

async function getHistory(tickers){
  if (PF.uploadedHist) return PF.uploadedHist;
  if (STATUS.server && !PF.isSample){
    const hk = tickers.slice().sort().join(',');
    if (PF.histCache && PF.histCache.key === hk && Date.now() - PF.histCache.at < 600000) return PF.histCache.val;
    try{
      const r = await getJson('/api/history?tickers=' + encodeURIComponent(tickers.join(',')) + '&days=504', 90000);
      if (!r.error && r.dates && r.dates.length > 60){ const val = {dates:r.dates, closes:r.closes, bench:'SPY', source:'yahoo', errors:r.errors || {}}; PF.histCache = {key:hk, at:Date.now(), val}; return val; }
      PF.msg = r.error || 'Yahoo returned too little price history.';
    }catch(e){ PF.msg = 'Could not reach Yahoo Finance through the local server.'; }
  }
  if (PF.isSample){
    const specs = {};
    tickers.forEach(t => {
      const d = dealForTicker(t);
      specs[t] = SAMPLE_SIM[t] || {beta:1.1, idio:0.3, price:d && STATE[d.id] && STATE[d.id].spot || 50};
    });
    const sim = simulateHistory(specs, 504, 20261006);
    return {dates:sim.dates, closes:sim.closes, bench:'SPY', source:'simulated'};
  }
  return null;
}
function dealForTicker(t){ return DEALS.find(d => d.ticker && d.ticker.toUpperCase() === t); }
function dealParams(t, horizonDays){
  const d = dealForTicker(t); if (!d) return null;
  const s = STATE[d.id];
  if (![s.offer, s.downside, s.spot].every(v => v > 0)) return null;
  const resolve = s.timing && s.timing.curve ? resolvedFromCurve(s.timing.curve, s.timing.elapsed, horizonDays) : resolvedByExpiry(horizonDays, s.dtc);
  return {id:d.id, name:d.target, offer:s.offer, downside:s.downside, spot:s.spot, cash:s.consideration === 'cash', bump:s.bump || 0,
          pClose:s.pClose, resolve, pPending:s.pPending, s2:s.pPending * s.offer + (1 - s.pPending) * s.downside, state:s, deal:d};
}

/* ===== Portfolio sheet: the model ===== */
async function buildPortfolio(){
  const P = PF.prefs, rf = P.rf / 100, erp = P.erp / 100, rfd = rf / 252, H = P.horizon;
  const hs = PF.holdings.filter(h => h.type === 'cash' ? isFinite(h.qty) : (h.ticker && h.qty && isFinite(h.qty)));
  const warn = [];
  if (!hs.length) return {error:'Add at least one holding.'};
  const under = Array.from(new Set(hs.filter(h => h.type !== 'cash').map(h => h.ticker)));
  const hist = under.length ? await getHistory(under) : null;
  let xm = null, sigmaM = 0.16, rm = null;
  if (hist && hist.closes[hist.bench]){ rm = dailyReturns(hist.closes[hist.bench]); xm = rm.map(v => v - rfd); sigmaM = sd(rm) * Math.sqrt(252); }
  const U = {};
  await Promise.all(under.map(t => { const d = dealForTicker(t); return d ? ensureNews(d) : null; }).filter(Boolean));
  under.forEach(t => {
    const c = hist && hist.closes[t], st = {ticker:t, source:'assumed'};
    if (c && c.length > 60 && xm){
      const r = dailyReturns(c), fit = olsFit(r.map(v => v - rfd), xm.slice(0, r.length));
      if (fit){ Object.assign(st, {beta:fit.beta, seBeta:fit.seBeta, alphaAnn:fit.alpha * 252, alphaT:fit.alpha / fit.seAlpha, resSd:fit.resSd, vol:sd(r) * Math.sqrt(252), last:c[c.length - 1], r, source:'history'}); }
    }
    if (st.source !== 'history'){
      const given = hs.find(h => h.ticker === t && h.beta !== null && h.beta !== undefined);
      const autoRow = hs.find(h => h.ticker === t && h.auto && h.auto.beta !== null && h.auto.beta !== undefined);
      st.beta = given ? given.beta : autoRow ? autoRow.auto.beta : 1; st.vol = 0.35;
      st.resSd = Math.sqrt(Math.max(st.vol * st.vol - st.beta * st.beta * sigmaM * sigmaM, 0.0225)) / Math.sqrt(252);
      st.last = null;
      if (!given && autoRow){ warn.push('Beta for ' + t + ' is ' + autoRow.auto.beta.toFixed(2) + ', looked up from Yahoo Finance.'); }
      else if (hist && !(c && c.length > 60)) warn.push('No price history for ' + t + '. Its beta is ' + (given ? 'the one in your file.' : 'assumed to be 1.0.'));
      else if (!hist) warn.push((given ? 'Beta for ' + t + ' comes from your file.' : 'No price history, so ' + t + ' is assumed to have beta 1.0.'));
    }
    const stockRow = hs.find(h => h.ticker === t && h.type === 'stock' && h.price > 0);
    const dp = dealParams(t, H);
    const autoPx = hs.find(h => h.ticker === t && h.auto && h.auto.price > 0);
    st.S = (stockRow && stockRow.price) || livePx(t) || st.last || (autoPx && autoPx.auto.price) || (dp && dp.spot) || null;
    st.deal = dp;
    U[t] = st;
  });

  const positions = [], rows = [];
  let V0 = 0;
  for (const h of hs){
    if (h.type === 'cash'){ positions.push({key:h.id, kind:'cash', qty:h.qty, value0:h.qty}); rows.push({h, label:'Cash', value:h.qty, exposure:0, beta:0, betaAdj:0, cash:true}); V0 += h.qty; continue; }
    const u = U[h.ticker];
    if (!u.S){ warn.push(h.ticker + ' has no price. Enter one in the Price column to include it.'); continue; }
    if (h.type === 'stock'){
      const value = h.qty * u.S;
      positions.push({key:h.id, kind:'stock', qty:h.qty, S:u.S, underlying:h.ticker, beta:u.beta, resSd:u.resSd, vol:u.vol, deal:u.deal, value0:value});
      rows.push({h, label:h.ticker + ' shares', value, exposure:value, u, deal:u.deal});
      V0 += value;
    } else {
      if (!(h.strike > 0) || !(h.days > 0)){ warn.push('The ' + h.ticker + ' ' + h.type + ' needs a strike and days to expiry.'); continue; }
      const T = h.days / 365; let model;
      if (u.deal){
        const s = u.deal.state;
        const res = s.timing && s.timing.curve ? resolvedFromCurve(s.timing.curve, s.timing.elapsed, h.days) : resolvedByExpiry(h.days, s.dtc);
        const sv = scenarioValue({offer:u.deal.offer, downside:u.deal.downside, spot:u.S, cash:u.deal.cash, bump:u.deal.bump},
          {kind:h.type, strike:h.strike, days:h.days, rate:rf, vol:s.vol || u.vol, premium:1}, {pClose:u.deal.pClose, resolve:res, pPending:u.deal.pPending});
        model = sv.fair;
      } else model = blackScholes(u.S, h.strike, T, rf, u.vol, h.type);
      const yMid = h.auto && h.auto.option && h.auto.option.premium > 0 ? h.auto.option.premium : null;
      const px = h.price > 0 ? h.price : yMid || model;
      const value = h.qty * 100 * px;
      const delta = bsDelta(u.S, h.strike, T, rf, u.vol, h.type);
      positions.push({key:h.id, kind:h.type, qty:h.qty, mult:100, S:u.S, K:h.strike, days:h.days, underlying:h.ticker, beta:u.beta, resSd:u.resSd, vol:u.deal ? (u.deal.state.vol || u.vol) : u.vol, deal:u.deal, value0:value});
      rows.push({h, label:h.ticker + ' ' + h.strike + ' ' + h.type + ' (' + h.days + 'd)', value, exposure:delta * h.qty * 100 * u.S, u, deal:u.deal, option:true, px, usedModelPrice:!(h.price > 0) && !yMid, usedYahooMid:!(h.price > 0) && !!yMid});
      V0 += value;
    }
  }
  if (!(V0 > 0)) return {error:'The portfolio value comes to zero or less, so there is nothing to measure. Check quantities and prices.', warn};
  rows.forEach(r => {
    r.weight = r.value / V0; r.exposure = (r.exposure || 0) / V0;
    if (r.u){ r.beta = r.u.beta; r.betaAdj = r.deal ? r.u.beta * (1 - r.deal.pClose) : r.u.beta; }
  });
  const betaTotal = rows.reduce((s, r) => s + (r.exposure || 0) * (r.beta || 0), 0);
  const betaAdj = rows.reduce((s, r) => s + (r.exposure || 0) * (r.betaAdj || 0), 0);

  // Historical measurement: replay today's exposures over the past returns
  let reg = null;
  if (hist && xm){
    const n = Math.min.apply(null, [xm.length].concat(rows.filter(r => r.u && r.u.r).map(r => r.u.r.length)));
    const withHist = rows.filter(r => r.u && r.u.source === 'history');
    if (n > 60 && withHist.length){
      const y = new Array(n).fill(0);
      withHist.forEach(r => { const e = r.exposure, rr = r.u.r; for (let t = 0; t < n; t++) y[t] += e * (rr[rr.length - n + t] - rfd); });
      const x = xm.slice(xm.length - n), fit = olsFit(y, x);
      if (fit){
        const rp = y.map(v => v + rfd);
        let peak = 1, cum = 1, dd = 0; rp.forEach(v => { cum *= 1 + v; peak = Math.max(peak, cum); dd = Math.min(dd, cum / peak - 1); });
        reg = {fit, n, alphaAnn:fit.alpha * 252, alphaT:fit.alpha / fit.seAlpha, beta:fit.beta, seBeta:fit.seBeta, r2:fit.r2,
               vol:sd(rp) * Math.sqrt(252), te:fit.resSd * Math.sqrt(252), sharpe:(mean(y) / (sd(y) || 1)) * Math.sqrt(252), maxDD:dd,
               ir:fit.resSd > 0 ? (fit.alpha * 252) / (fit.resSd * Math.sqrt(252)) : null, x, y, covered:withHist.reduce((s, r) => s + Math.abs(r.exposure), 0) / (rows.reduce((s, r) => s + Math.abs(r.exposure || 0), 0) || 1)};
      }
    }
  }

  // Forward view: simulate the horizon with deal outcomes
  const mc = simulatePortfolio({positions, mkt:{sigma:sigmaM, rf, erp}, horizonDays:H, corr:P.corr / 100, nPaths:4000, seed:12345});
  const hy = H / 365;
  const forwardAlpha = (mc.mean - (rf * hy + betaAdj * erp * hy)) / hy;

  // Loss if each deal breaks (market flat), as a share of the portfolio
  const dealRows = rows.filter(r => r.deal);
  dealRows.forEach(r => {
    const d = r.deal, u = r.u;
    let after;
    if (r.option){ const Trem = Math.max(r.h.days / 365 - H / 365, 0); after = r.h.qty * 100 * blackScholes(d.downside, r.h.strike, r.h.days / 365, rf, d.state.vol || u.vol, r.h.type); }
    else after = r.h.qty * d.downside;
    r.breakLoss = Math.max(0, (r.value - after) / V0);
    r.gainIfClose = (() => { const S1 = d.offer * (1 + d.bump); const v1 = r.option ? r.h.qty * 100 * blackScholes(S1, r.h.strike, r.h.days / 365, rf, d.cash ? VOL_PINNED_CASH : (d.state.vol || u.vol) * STOCK_DEAL_VOL_FACTOR, r.h.type) : r.h.qty * S1; return (v1 - r.value) / V0; })();
  });
  const dealIds = Array.from(new Set(dealRows.map(r => r.deal.id)));
  const dealWeight = {}; dealRows.forEach(r => { dealWeight[r.deal.id] = (dealWeight[r.deal.id] || 0) + r.weight; });

  // Checks against the user's risk preferences
  const tol = P.tol / 100, checks = [];
  checks.push({id:'beta', label:'Market beta (deal-adjusted)', value:betaAdj.toFixed(2), limit:'Target ' + P.betaMin + ' to ' + P.betaMax, ok:betaAdj >= P.betaMin && betaAdj <= P.betaMax});
  checks.push({id:'loss', label:'Worst case over ' + H + ' days (95%)', value:'-' + pct(mc.var95, 1), limit:'Your limit -' + P.tol + '%', ok:mc.var95 <= tol});
  const maxW = dealIds.length ? Math.max.apply(null, dealIds.map(i => dealWeight[i])) : 0;
  checks.push({id:'conc', label:'Largest single deal position', value:dealIds.length ? pct(maxW, 1) : 'none', limit:'Your cap ' + P.maxDeal + '%', ok:maxW * 100 <= P.maxDeal});
  const minP = dealIds.length ? Math.min.apply(null, dealRows.map(r => r.deal.pClose)) : null;
  checks.push({id:'prob', label:'Weakest deal close odds', value:minP === null ? 'none' : pct(minP, 0), limit:'Your minimum ' + P.minClose + '%', ok:minP === null || minP * 100 >= P.minClose});

  // Plain-language suggestions
  const tips = [];
  const price1 = r => r.option ? r.px * 100 : (r.u && r.u.S);
  dealIds.forEach(id => {
    const rs = dealRows.filter(r => r.deal.id === id), w = dealWeight[id], name = rs[0].deal.name;
    if (w * 100 > P.maxDeal){
      const sell = rs.map(r => { const share = r.weight / w, cut = (w - P.maxDeal / 100) * share * V0; return Math.max(0, Math.ceil(cut / price1(r))) + ' ' + (r.option ? 'contracts of the ' + r.h.strike + ' ' + r.h.type : 'shares'); }).join(' and ');
      tips.push('Your ' + name + ' position is ' + pct(w, 1) + ' of the portfolio against a cap of ' + P.maxDeal + '%. Selling about ' + sell + ' brings it to the cap.');
    }
    const bl = rs.reduce((s, r) => s + r.breakLoss, 0);
    if (bl > tol / 2) tips.push('If the ' + name + ' deal breaks you lose about ' + pct(bl, 1) + ' of the portfolio at once. That is more than half of your ' + P.tol + '% limit. Trim it or hedge with a put.');
  });
  if (!checks[0].ok){
    const top = rows.filter(r => !r.cash).sort((a, b) => Math.abs(b.exposure * b.betaAdj) - Math.abs(a.exposure * a.betaAdj))[0];
    tips.push(betaAdj > P.betaMax ? 'Beta is above your range. The biggest contributor is ' + top.label + '. Trimming it or adding cash lowers beta.' : 'Beta is below your range. The portfolio moves less with the market than you asked for. More market exposure would lift it.');
  }
  if (!checks[1].ok && !tips.length) tips.push('Overall downside is larger than your limit. Reduce the largest or most volatile positions, or hold more cash.');
  dealRows.filter(r => r.deal.pClose * 100 < P.minClose).forEach(r => { tips.push('The ' + r.deal.name + ' deal has a ' + pct(r.deal.pClose, 0) + ' chance of closing, below your ' + P.minClose + '% minimum.'); });
  if (reg && reg.covered < 0.97) warn.push('Alpha and beta cover ' + pct(reg.covered, 0) + ' of your exposure. The rest has no price history.');

  return {rows, V0, hist, reg, betaTotal, betaAdj, mc, forwardAlpha, sigmaM, checks, tips, warn, dealRows, dealWeight, tol, H, rf, erp};
}

async function lookupRow(h){

function histogram(m){
  const r = m.mc.rets, n = r.length, lo = quantile(r, 0.005), hi = quantile(r, 0.995), B = 40, w = (hi - lo) / B, counts = new Array(B).fill(0);
  for (let i = 0; i < n; i++){ const k = Math.floor((r[i] - lo) / w); if (k >= 0 && k < B) counts[k]++; }
  const mx = Math.max.apply(null, counts), W = 640, Hh = 190, L = 14, R = 626, top = 24, base = 150;
  const X = v => L + (v - lo) / (hi - lo) * (R - L), bw = (R - L) / B - 1;
  let g = '<div class="lwrap"><svg class="ladder" viewBox="0 0 640 205" role="img" aria-label="Distribution of simulated portfolio returns">';
  counts.forEach((c, k) => { const x0 = lo + k * w, h = c / mx * (base - top), bad = x0 + w / 2 < -m.tol; g += '<rect x="' + (L + k * (R - L) / B) + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '" rx="1.5" fill="' + (bad ? 'var(--bad)' : 'var(--accent)') + '" opacity="' + (bad ? '.85' : '.6') + '"/>'; });
  g += '<line x1="' + L + '" x2="' + R + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)"/>';
  const ticks = []; const step = Math.max(0.05, Math.round((hi - lo) / 5 * 20) / 20);
  for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) ticks.push(t);
  ticks.forEach(t => { g += '<text x="' + X(t) + '" y="' + (base + 15) + '" text-anchor="middle">' + (t * 100).toFixed(0) + '%</text>'; });
  const mark = (v, label, col, y, dash) => { if (v < lo || v > hi) return ''; return '<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + (top - 6) + '" y2="' + base + '" stroke="' + col + '" stroke-width="1.6"' + (dash ? ' stroke-dasharray="4 3"' : '') + '/><text x="' + X(v) + '" y="' + y + '" text-anchor="middle" style="fill:' + col + '">' + label + '</text>'; };
  g += mark(-m.tol, 'Your limit -' + (m.tol * 100).toFixed(0) + '%', 'var(--bad)', 12, false);
  g += mark(-m.mc.var95, 'Worst case -' + (m.mc.var95 * 100).toFixed(1) + '%', 'var(--warn)', base + 30, true);
  g += mark(m.mc.mean, 'Average ' + sp(m.mc.mean, 1), 'var(--good)', base + 44, true);
  return g + '</svg></div>';
}
function scatter(reg){
  const k = Math.min(reg.n, 252), xs = reg.x.slice(-k), ys = reg.y.slice(-k);
  const ext = Math.max(0.01, Math.max.apply(null, xs.map(Math.abs)), Math.max.apply(null, ys.map(Math.abs))) * 1.1;
  const W = 640, Hh = 270, L = 46, R = 620, T = 12, Bm = 240, X = v => L + (v + ext) / (2 * ext) * (R - L), Y = v => Bm - (v + ext) / (2 * ext) * (Bm - T);
  let g = '<div class="lwrap"><svg class="ladder" style="max-width:760px" viewBox="0 0 640 290" role="img" aria-label="Portfolio daily excess returns against market daily excess returns with fitted line">';
  const tk = [-1, -0.5, 0, 0.5, 1].map(f => f * ext);
  tk.forEach(t => { g += '<line x1="' + L + '" x2="' + R + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--line)" opacity="' + (t === 0 ? 1 : .5) + '"/><text x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + (t * 100).toFixed(1) + '%</text>'; g += '<text x="' + X(t) + '" y="' + (Bm + 16) + '" text-anchor="middle">' + (t * 100).toFixed(1) + '%</text>'; });
  g += '<line x1="' + X(0) + '" x2="' + X(0) + '" y1="' + T + '" y2="' + Bm + '" stroke="var(--line)"/>';
  xs.forEach((x, i) => { g += '<circle cx="' + X(x) + '" cy="' + Y(ys[i]) + '" r="2.6" fill="var(--accent)" opacity=".45"/>'; });
  const a = reg.fit.alpha, b = reg.fit.beta;
  g += '<line x1="' + X(-ext) + '" y1="' + Y(a + b * -ext) + '" x2="' + X(ext) + '" y2="' + Y(a + b * ext) + '" stroke="var(--ink)" stroke-width="2"/>';
  g += '<text x="' + (L + 8) + '" y="' + (T + 14) + '" text-anchor="start" class="v">beta ' + reg.beta.toFixed(2) + ', alpha ' + sp(reg.alphaAnn, 1) + ' a year</text>';
  g += '<text x="' + ((L + R) / 2) + '" y="' + (Bm + 34) + '" text-anchor="middle">Market daily excess return</text>';
  return g + '</svg></div>';
}

    else if (hh && (hf === 'strike' || hf === 'days' || hf === 'type')){ if (hf === 'type') renderRows(); lookupRow(hh); }
    if (e.target.id === 'pfFile' && e.target.files[0]) readFile(e.target.files[0], loadHoldings);
    if (e.target.id === 'pfHist' && e.target.files[0]) readFile(e.target.files[0], t => { try{ PF.uploadedHist = parseHistory(t); pfMessage('Loaded price history: ' + PF.uploadedHist.dates.length + ' days for ' + Object.keys(PF.uploadedHist.closes).length + ' series.' + PF.uploadedHist.note); schedulePF(0); }catch(err){ pfMessage(err.message, true); } }); });
}
(function(){
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
  if (location.hash === '#portfolio') showTab('portfolio');
})();

</script>
