<title>Deal Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Brokerage quote screen: watchlist, one price, one order ticket. */
:root{
  --bg:#ffffff; --ink:#000000; --muted:#6e7278; --faint:#9aa0a6;
  --line:#ececec; --soft:#f4f4f5; --surface:#ffffff; --surface2:#f4f4f5;
  --up:#00c805; --down:#ff5000; --accent:#000000; --accent-bg:#f4f4f5;
  --good:#00c805; --good-bg:#e9fbe8; --warn:#c47b00; --warn-bg:#fff6e5; --bad:#ff5000; --bad-bg:#fff1ea;
  --shadow:none;
  --head:'Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#ffffff; --muted:#a3a8b0; --faint:#6e7278;
    --line:#2a2a2a; --soft:#141414; --surface:#000000; --surface2:#141414;
    --accent:#ffffff; --accent-bg:#141414;
    --good-bg:#062e0c; --warn-bg:#2a2108; --bad-bg:#2e1208;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}

.top{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:16px 28px}
.brand{margin-right:auto}
.brand h1{font-size:18px;font-weight:600;letter-spacing:-.03em}
.guide{max-width:1120px;margin:0 auto;padding:18px 28px 0;color:var(--muted);font-size:14px}
.status{max-width:1120px;margin:0 auto;padding:14px 28px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.status .cell{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.status small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.status b{display:block;font-size:14px;font-weight:600}
.status span{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.status .err{grid-column:1 / -1;color:var(--down);font-size:13px}
@media (max-width:700px){.status{grid-template-columns:1fr 1fr;padding-left:16px;padding-right:16px}}
.btn{border:0;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--up);outline-offset:2px}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:8px 36px;max-width:1120px;margin:0 auto;padding:12px 28px 64px}
@media (max-width:900px){.shell{grid-template-columns:1fr;padding:8px 16px 40px}.topbar,.guide{padding-left:16px;padding-right:16px}}

.notice{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--accent-bg);font-size:13.5px}
.notice.err{background:var(--bad-bg)}

.list{align-self:start;padding-top:8px}
.list h2{font-size:13px;font-weight:600;color:var(--muted);margin:8px 12px 4px}
.list h2 .count{color:var(--ink);font-variant-numeric:tabular-nums}
.list .hint{margin:0 12px 10px;color:var(--faint);font-size:12.5px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:1px;width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:10px 12px;cursor:pointer}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft)}
.item .nm{font-weight:600;font-size:14.5px}
.item .tk{grid-column:1;color:var(--muted);font-size:12.5px}
.item .act{grid-row:1;grid-column:2;font-weight:600;font-size:14px;text-align:right}
.item .px{grid-row:2;grid-column:2;color:var(--muted);font-size:12.5px;text-align:right}
.act.bid{color:var(--up)} .act.ask{color:var(--down)} .act.pass,.act.unknown,.act.terms_need_verification,.act.retrieval_failed,.act.parsing_failed,.act.no_relevant_filing{color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}.ticket{order:-1}}
.kicker{margin:0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em}
.read h2{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:2px 0 6px}
.lede{margin:0 0 18px;color:var(--muted);font-size:15px}
.pxbig{font-size:52px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pxsub{margin:8px 0 0;font-size:16px;font-weight:600}
.pxsub.bid{color:var(--up)} .pxsub.ask{color:var(--down)} .pxsub.pass{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
@media (max-width:700px){.stats{grid-template-columns:1fr;gap:12px}}
.stat small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.map{position:relative;height:78px;margin:22px 8px 6px}
.map-line{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--line);border-radius:2px}
.mark{position:absolute;top:22px;width:14px;height:14px;transform:translateX(-50%)}
.mark i{display:block;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.mark.now{top:20px}
.mark.now i{background:var(--up);width:14px;height:14px}
.rows{margin-top:8px}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.rows b{font-weight:600;font-variant-numeric:tabular-nums}
.rows .you{font-weight:600}
.ticket{position:sticky;top:78px;border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;background:var(--surface)}
.ticket h3{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:10px}
.verb{display:block;border-radius:12px;padding:16px 16px 14px;margin-bottom:14px}
.verb.bid{background:var(--up);color:#041204}
.verb.ask{background:#1c1c1e;color:#fff}
.verb.pass{background:var(--soft);color:var(--ink)}
.verb strong{display:block;font-size:28px;letter-spacing:-.03em;line-height:1.1}
.verb em{display:block;margin-top:4px;font-style:normal;font-size:14px;font-weight:500}
.ticket .line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.ticket .line span{color:var(--muted)}
.ticket .line b{font-weight:600;font-variant-numeric:tabular-nums}
.ticket .say{margin:10px 0 0;font-size:14px}
.ticket .fine{margin-top:12px}
a{color:var(--accent)}

.banner{border-radius:14px;padding:20px 22px;margin-bottom:16px;border:1px solid transparent;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.banner{grid-template-columns:1fr}}
.banner.buy{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.banner.fair{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.avoid{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.unknown{background:var(--surface2);border-color:var(--line)}
.banner .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.banner.buy .lab,.banner.buy .big{color:var(--good)}
.banner.fair .lab,.banner.fair .big{color:var(--warn)}
.banner.avoid .lab,.banner.avoid .big{color:var(--bad)}
.banner .big{font-family:var(--head);font-size:34px;font-weight:700;line-height:1.1;margin:2px 0 6px}
.banner p{margin:0;font-size:15px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:10px;padding:10px 12px}
.key small{display:block;font-size:11.5px;color:var(--muted)}
.key b{font-family:var(--mono);font-weight:500;font-size:18px}

.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:900px){.scen{grid-template-columns:1fr}}
.sc{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.sc.close{--c:var(--good)} .sc.pending{--c:var(--warn)} .sc.break{--c:var(--bad)}
.sc .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc .t b{font-family:var(--head);font-size:16px}
.sc .p{font-family:var(--mono);font-size:22px;color:var(--c)}
.sc .d{color:var(--muted);font-size:13px;margin:4px 0 12px;min-height:58px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
.row span:first-child{color:var(--muted)}
.row b{font-family:var(--mono);font-weight:500}

.bar{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px;margin:6px 0 4px}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-family:var(--mono);min-width:0;overflow:hidden;white-space:nowrap}
.bar .b1{background:var(--good)} .bar .b2{background:#c88a1a} .bar .b3{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
svg.ladder{width:100%;min-width:560px;height:auto;display:block;margin-top:8px}
.lwrap{overflow-x:auto}
svg text{font-family:var(--body);fill:var(--muted);font-size:11.5px}
svg text.v{font-family:var(--mono);fill:var(--ink);font-size:12.5px}

.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.two .card{margin-bottom:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-family:var(--mono);font-size:14px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:3px}
.assumed{outline:0;border-color:var(--warn)!important}
.slider{margin-bottom:14px}
.slider .top2{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:2px}
.slider .top2 b{font-family:var(--mono);font-weight:500}
.slider input{width:100%;accent-color:var(--accent)}
.slider .hint{font-size:12px;color:var(--faint)}
.cmp{display:grid;gap:10px;margin:8px 0 12px}
.cmp .l{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:3px}
.cmp .l b{font-family:var(--mono);font-weight:500}
.cmp .tr{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.cmp .tr i{display:block;height:100%;border-radius:6px}
.drv{list-style:none;padding:0;margin:0}
.drv li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.drv li:first-child{border-top:0}
.drv .dl{font-family:var(--mono);font-size:12.5px;min-width:52px;text-align:right;padding-top:1px}
.drv .dl.up{color:var(--good)} .drv .dl.down{color:var(--bad)} .drv .dl.zero{color:var(--faint)}
.drv small{display:block;color:var(--muted);font-size:12.5px}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--line);color:var(--muted);font-size:13px;background:var(--surface2);border-radius:0 8px 8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--surface2);padding:3px 10px;border-radius:99px;color:var(--muted)}
details{font-size:14px}
summary{cursor:pointer;font-weight:600;font-family:var(--head)}
details p,details li{color:var(--muted);font-size:13.5px}
.fine{font-size:12.5px;color:var(--faint);margin-top:18px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
</style>

<header class="top">
  <div class="topbar">
    <div class="brand"><h1>Deal Radar</h1></div>
    <button class="btn" id="scanBtn" type="button">Scan filings</button>
  </div>
</header>
<p class="guide">Pick a company. You will see the stock price, the chance the buyout happens, and whether to buy, sell, or wait.</p>
<section id="status" class="status" aria-label="Data status"></section>

<main class="shell">
  <aside class="list" id="list" aria-label="Companies being bought"></aside>
  <section id="detail" aria-live="polite"></section>
</main>

<script>
/* ---------- Pricing (mirrors pricing.py) ---------- */
const VOL_PINNED_CASH = 0.12, VOL_PENDING = 0.18, STOCK_DEAL_VOL_FACTOR = 0.9;

function erf(x){
  const sign = x < 0 ? -1 : 1; x = Math.abs(x);
  if (x > 3){
    const x2 = x * x;
    const erfc = Math.exp(-x2) / (x * Math.sqrt(Math.PI)) * (1 - 1/(2*x2) + 3/(4*x2*x2) - 15/(8*x2*x2*x2));
    return sign * (1 - erfc);
  }
  let sum = 0, term = x;
  for (let n = 0; n < 80; n++){
    sum += term / (2*n + 1);
    term *= -x * x / (n + 1);
  }
  return sign * 2 / Math.sqrt(Math.PI) * sum;
}
const normCdf = x => 0.5 * (1 + erf(x / Math.SQRT2));

function blackScholes(spot, strike, years, rate, vol, kind){
  if (years <= 0 || vol <= 0){
    const disc = strike * Math.exp(-rate * Math.max(years, 0));
    return kind === 'call' ? Math.max(spot - disc, 0) : Math.max(disc - spot, 0);
  }
  const sq = Math.sqrt(years);
  const d1 = (Math.log(spot / strike) + (rate + vol * vol / 2) * years) / (vol * sq);
  const d2 = d1 - vol * sq;
  const disc = strike * Math.exp(-rate * years);
  return kind === 'call' ? spot * normCdf(d1) - disc * normCdf(d2) : disc * normCdf(-d2) - spot * normCdf(-d1);
}

function resolvedByExpiry(daysToExpiry, daysToClose){
  if (daysToClose <= 0) return 0.97;
  const q = daysToExpiry / daysToClose;
  return Math.min(0.97, Math.max(0.03, (q - 0.4) / (1.3 - 0.4)));
}

function resolvedFromCurve(curve, elapsed, extra){
  const F = d => {
    if (d <= curve[0][0]) return curve[0][1];
    for (let i = 1; i < curve.length; i++){
      if (d <= curve[i][0]) return curve[i-1][1] + (curve[i][1] - curve[i-1][1]) * (d - curve[i-1][0]) / (curve[i][0] - curve[i-1][0]);
    }
    return curve[curve.length - 1][1];
  };
  const now = F(elapsed);
  if (now >= 0.999) return 0.97;
  return Math.min(0.97, Math.max(0.03, (F(elapsed + extra) - now) / (1 - now)));
}

function scenarioValue(deal, c, p){
  const T = c.days / 365, r = c.rate, K = c.strike, kind = c.kind;
  const O = deal.offer, D = deal.downside, S0 = deal.spot, sigma = c.vol;
  const w1 = p.pClose * p.resolve, w3 = (1 - p.pClose) * p.resolve, w2 = 1 - p.resolve;
  const s1 = O * (1 + (deal.bump || 0));
  const s2 = p.pPending * O + (1 - p.pPending) * D;
  const s3 = D;
  const v1vol = deal.cash ? VOL_PINNED_CASH : sigma * STOCK_DEAL_VOL_FACTOR;
  const v1 = blackScholes(s1, K, T, r, v1vol, kind);
  const v2 = blackScholes(s2, K, T, r, VOL_PENDING, kind);
  const v3 = blackScholes(s3, K, T, r, sigma, kind);
  const fair = w1 * v1 + w2 * v2 + w3 * v3;
  const plain = blackScholes(S0, K, T, r, sigma, kind);
  let implied = null;
  if (Math.abs(v1 - v3) > 1e-9 && p.resolve > 1e-9){
    const rv = (c.premium - w2 * v2) / p.resolve;
    implied = Math.min(1, Math.max(0, (rv - v3) / (v1 - v3)));
  }
  return {
    scenarios: [
      {key:'close', weight:w1, spot:s1, value:v1},
      {key:'pending', weight:w2, spot:s2, value:v2},
      {key:'break', weight:w3, spot:s3, value:v3}],
    fair, plain, implied,
    edge: c.premium > 0 ? (fair - c.premium) / c.premium : null
  };
}
function verdictOf(edge){
  if (edge === null || edge === undefined || !isFinite(edge)) return 'unknown';
  return edge >= 0.20 ? 'buy' : edge >= -0.10 ? 'fair' : 'avoid';
}

/* ---------- Data ---------- */
const SAMPLE = /*__SAMPLE__*/[];
let DEALS = SAMPLE.slice();
let STATE = {};            // per deal: the numbers the user can change
let SELECTED = null;
let STATUS = {edgar:false, dealroom:false, llm:false, server:false, mode:'live'};
let SCAN_ERROR = null;

const $ = id => document.getElementById(id);
const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? null : +v;
const money = x => {
  if (x === null || x === undefined || !isFinite(x)) return '—';
  const n = Math.abs(x).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (x < 0 ? '-$' : '$') + n;
};
const pct = (x, d = 0) => x === null || x === undefined || !isFinite(x) ? 'n/a' : (x * 100).toFixed(d) + '%';
const spct = (x, d = 0) => x === null || !isFinite(x) ? 'n/a' : (x >= 0 ? '+' : '-') + Math.abs(x * 100).toFixed(d) + '%';
function decodeText(s){
  let cur = String(s == null ? '' : s);
  for (let i = 0; i < 3; i++){
    const doc = new DOMParser().parseFromString('<!doctype html><body>' + cur, 'text/html');
    const next = doc.body ? doc.body.textContent : cur;
    if (next === cur) break;
    cur = next;
  }
  return cur;
}
const esc = s => decodeText(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function daysUntil(iso){
  if (!iso) return null;
  const d = Math.round((new Date(iso + 'T00:00:00Z') - Date.now()) / 86400000);
  return d > 0 ? d : null;
}
function filedAgo(d){
  if (d.filedDaysAgo != null) return d.filedDaysAgo;
  if (d.filedOn){ const n = Math.round((Date.now() - new Date(d.filedOn + 'T00:00:00Z')) / 86400000); return Math.max(0, n); }
  return null;
}

function story(d){
  const f = d.flags || {};
  const SCALE = 0.09;
  let z = Math.log(0.9 / 0.1);
  const lines = [{text: 'Most announced buyouts close. Start at 90%.', p: 0.9}];
  const add = (text, pts) => { z += pts / SCALE; lines.push({text, p: 1 / (1 + Math.exp(-z))}); };
  if (f.hsr) add('It needs a routine US antitrust filing. That barely moves the odds.', -0.01);
  if (f.secondRequest) add('Regulators asked for a deeper review. That is the big drop.', -0.10);
  if ((f.foreign || []).length) add('It also needs approval from ' + f.foreign.join(', ') + '.', -Math.min(0.03 * f.foreign.length, 0.09));
  if ((f.other || []).length) add('Another regulator has to sign off: ' + f.other.join(', ') + '.', -Math.min(0.03 * f.other.length, 0.06));
  if (f.financingCondition === true) add('The buyer still has to borrow the money.', -0.06);
  if (f.financingCondition === false) add('The buyer does not need new financing to close.', 0.01);
  if (f.tender) add('Holders can sell straight into a tender, with no meeting to wait for.', 0.02);
  else if (f.vote) add('Shareholders still have to vote. Most of those votes pass.', -0.01);
  if (f.goShop) add('The company can look for a higher bid for a while.', -0.01);
  if ((d.consideration || '') === 'stock') add('Payment is in the buyer’s stock, so the value can move.', -0.02);
  return {p: 1 / (1 + Math.exp(-z)), lines};
}
function stockQuote(s){
  const offer = s.offer, spot = s.spot, down = s.downside, days = s.dtc, p = s.pClose;
  if (![offer, spot, down, days, p].every(v => v !== null && isFinite(v) && v > 0)) return null;
  const rate = s.rate > 0 ? s.rate : 0.045;
  const years = days / 365;
  const pv = offer * Math.exp(-rate * years);

  if (action !== 'pass'){
    const loss = action === 'bid' ? spot - down : offer - spot;
    if (loss > 0){
      const shares = Math.floor(Math.min(100000 * 0.02 / loss, 100000 * 0.15 / spot));

    const span = hi - lo || 1;
    $('track').innerHTML = '<div class="map" role="img" aria-label="Price if the deal dies, your buy price, the stock today, your sell price, and the offer"><div class="map-line"></div>' +
      marks.map(([, val, cls]) => '<div class="mark ' + cls + '" style="left:' + ((val - lo) / span * 100) + '%"><i></i></div>').join('') +
      '</div><div class="rows">' +
      '<div><span>If the deal dies</span><b>' + money(s.downside) + '</b></div>' +
      '<div><span>Highest price to buy</span><b>' + money(q.bid) + '</b></div>' +
      '<div class="you"><span>Stock today</span><b>' + money(s.spot) + '</b></div>' +
      '<div><span>Lowest price to sell</span><b>' + money(q.ask) + '</b></div>' +
      '<div><span>If the deal closes</span><b>' + money(s.offer) + '</b></div></div>';
    const valueNote = 'Your value of ' + money(q.value) + ' discounts the ' + money(s.offer) + ' offer for ' + Math.round(s.dtc) + ' days at ' + pct(s.rate > 0 ? s.rate : 0.045, 1) + ' a year, to ' + money(q.pv) + '. It then takes ' + pct(your, 0) + ' of that and the rest at the ' + money(s.downside) + ' break price. It is not the undiscounted offer times the chance. Buy only below ' + money(q.bid) + ' and sell only above ' + money(q.ask) + '. That band is the value plus or minus the larger of 4% of the spread and an 8% yearly wait. Inside the band, wait. ';
    let say = 'The stock is using a ' + pct(Math.min(1, Math.max(0, q.pMarket)), 0) + ' chance. Yours is ' + pct(your, 0) + '.';
    if (q.pMarket > 1 && s.spot > s.offer + 0.009) say = 'The stock is above the cash offer, so the price assumes a higher bid or a stale offer.';
    else if (q.pMarket > 1 && s.downside >= s.spot - 0.02) say = 'The price before this filing is already about where the stock trades, so this is probably not the first announcement. The chance implied by the stock is not usable.';
    else if (q.pMarket > 1) say = 'The stock is at the offer. Waiting until the close makes that cash worth less, so the price assumes a higher bid or a faster close.';
    if (q.size){
      say += q.action === 'bid'
        ? ' Buy ' + q.size.shares.toLocaleString() + ' shares (' + money(q.size.notional) + '). If the deal dies, that loses about ' + money(q.size.lossDollars) + '.'
        : ' Sell ' + q.size.shares.toLocaleString() + ' shares (' + money(q.size.notional) + '). If the deal closes, that loses about ' + money(q.size.lossDollars) + '.';
    } else if (q.action === 'pass') {
      say += ' The gap is smaller than the cushion for being wrong or for waiting, so there is no order.';
    }
    $('ticket').innerHTML = '<h3>What to do</h3><div class="verb ' + q.action + '" role="status"><strong>' + verb + '</strong><em>' + limit + '</em></div>' +
      '<div class="line"><span>Stock today</span><b>' + money(s.spot) + '</b></div>' +
      '<div class="line"><span>Your value</span><b>' + money(q.value) + '</b></div>' +
      '<div class="line"><span>' + (q.action === 'bid' ? 'Buy up to' : q.action === 'ask' ? 'Sell down to' : 'Your range') + '</span><b>' +
      (q.action === 'pass' ? money(q.bid) + ' – ' + money(q.ask) : money(q.action === 'bid' ? q.bid : q.ask)) + '</b></div>' +
      '<p class="say">' + valueNote + say + '</p><p class="fine">This does not place an order.</p>';
  }
  const lines = filing.lines.map(line => '<div><span>' + esc(line.text) + '</span><b>' + pct(line.p, 0) + '</b></div>').join('');
  const edited = s.pCloseManual ? '<p class="sub">You moved the chance to ' + pct(your, 0) + '. The filing, before that, said ' + pct(filing.p, 0) + '.</p>' : '';
  $('why').innerHTML = edited + '<div class="rows">' + lines + '</div>';
}

function paint(){
  const d = DEALS.find(x => x.id === SELECTED), s = STATE[SELECTED], out = compute(s);
  const kind = s.kind === 'put' ? 'put' : 'call';
  paintQuote(d, s);

  if (!out){
    if ($('banner')) $('banner').innerHTML = '<p class="sub">Add the option price, strike, and expiry to see this.</p>';
    if ($('scen')) $('scen').innerHTML = '';
    if ($('viz')) $('viz').innerHTML = '';
    if ($('compare')) $('compare').innerHTML = '';
    return;
  }

  const v = verdictOf(out.edge), edge = out.edge;
  const noun = kind === 'put' ? 'put' : 'call';
  let head, body;
  if (v === 'buy'){
    head = 'Buy';
    body = 'The model values this ' + noun + ' at ' + money(out.fair) + ' and the market charges ' + money(s.premium) + '. You would pay about ' + pct(Math.abs(edge / (1 + edge)), 0) + ' less than the model says it is worth.';
  } else if (v === 'fair'){
    head = 'Fairly priced';
    body = 'The model values this ' + noun + ' at ' + money(out.fair) + ' and the market charges ' + money(s.premium) + '. The gap is too small to count as an edge, so there is no strong reason to buy.';
  } else {
    head = 'Avoid';
    body = 'The model values this ' + noun + ' at ' + money(out.fair) + ' but the market charges ' + money(s.premium) + ', about ' + pct(Math.abs(edge / (1 + edge)), 0) + ' more than the model says it is worth.';
  }
  if (out.implied !== null) body += ' At this price the market is assuming a ' + pct(out.implied) + ' chance the deal closes, and you assumed ' + pct(s.pClose) + '.';
  $('banner').innerHTML = '<div class="banner ' + v + '"><div><div class="lab">Verdict on this ' + noun + '</div><div class="big">' + head + '</div><p>' + body + '</p></div>' +
    '<div class="keys"><div class="key"><small>Market asks</small><b>' + money(s.premium) + '</b></div><div class="key"><small>Model value</small><b>' + money(out.fair) + '</b></div><div class="key"><small>Edge</small><b>' + spct(edge, 0) + '</b></div></div></div>';

  // scenario cards
  $('scen').innerHTML = out.scenarios.map(sc => {
    const contrib = out.fair > 1e-9 ? sc.weight * sc.value / out.fair : 0;
    const move = (sc.spot - s.spot) / s.spot;
    return '<div class="sc ' + sc.key + '"><div class="t"><b>' + SC_TEXT[sc.key][0] + '</b><span class="p">' + pct(sc.weight) + '</span></div>' +
      '<div class="d">' + SC_TEXT[sc.key][1] + '</div>' +
      '<div class="row"><span>Stock trades at</span><b>' + money(sc.spot) + ' (' + spct(move, 1) + ')</b></div>' +
      '<div class="row"><span>Contract worth</span><b>' + money(sc.value) + '</b></div>' +
      '<div class="row"><span>Share of model value</span><b>' + pct(contrib) + '</b></div></div>';
  }).join('');

  // probability bar + ladder
  const [a, b, c] = out.scenarios;
  const seg = (cls, w) => '<div class="' + cls + '" style="flex:' + Math.max(w, 0.0001) + '">' + (w >= 0.08 ? pct(w) : '') + '</div>';
  $('viz').innerHTML =
    '<div class="bar" role="img" aria-label="Closes ' + pct(a.weight) + ', unresolved ' + pct(b.weight) + ', breaks ' + pct(c.weight) + '">' + seg('b1', a.weight) + seg('b2', b.weight) + seg('b3', c.weight) + '</div>' +
    '<div class="legend"><span><i style="background:var(--good)"></i>Closes ' + pct(a.weight) + '</span><span><i style="background:#c88a1a"></i>Unresolved ' + pct(b.weight) + '</span><span><i style="background:var(--bad)"></i>Breaks ' + pct(c.weight) + '</span></div>' +
    '<div class="lwrap">' + ladder(s, out, kind) + '</div>';

  // compare bars
  const mx = Math.max(s.premium, out.fair, out.plain, 0.01);
  const bar = (label, val, color) => '<div><div class="l"><span>' + label + '</span><b>' + money(val) + '</b></div><div class="tr"><i style="width:' + Math.max(1, val / mx * 100) + '%;background:' + color + '"></i></div></div>';
  $('compare').innerHTML = '<div class="cmp">' +
    bar('Market premium', s.premium, 'var(--faint)') +
    bar('Plain Black-Scholes', out.plain, 'var(--accent)') +
    bar('Deal-adjusted value', out.fair, v === 'buy' ? 'var(--good)' : v === 'avoid' ? 'var(--bad)' : 'var(--warn)') + '</div>' +
    '<p class="sub" style="margin:0">Plain Black-Scholes ignores the deal and treats the stock as free to wander at ' + pct(s.vol) + ' volatility. ' +
    (Math.abs(out.plain - out.fair) / Math.max(out.plain, 0.01) > 0.15
      ? 'Here it is ' + (out.plain > out.fair ? 'too high' : 'too low') + ' by ' + money(Math.abs(out.plain - out.fair)) + ' because the offer price caps or anchors where the stock can go.'
      : 'Here it lands close to the deal-adjusted value.') + '</p>';
}

function ladder(s, out, kind){
  const [a, b, c] = out.scenarios;
  const pts = [
    {x:c.spot, name:'Deal breaks', col:'var(--bad)'},
    {x:b.spot, name:'Unresolved', col:'#c88a1a'},
    {x:s.spot, name:'Today', col:'var(--ink)'},
    {x:a.spot, name:'Deal closes', col:'var(--good)'}
  ];
  const all = pts.map(p => p.x).concat([s.strike]);
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  const pad = (hi - lo) * 0.12 || hi * 0.05;
  lo -= pad; hi += pad;
  const W = 640, L = 28, R = 612, y0 = 78;
  const X = v => L + (v - lo) / (hi - lo) * (R - L);
  let g = '<svg class="ladder" viewBox="0 0 640 140" role="img" aria-label="Stock price in each outcome compared with the strike price">';
  // pays-off band
  const kx = X(s.strike);
  g += kind === 'call'
    ? '<rect x="' + kx + '" y="' + (y0 - 5) + '" width="' + Math.max(0, R - kx) + '" height="10" rx="5" fill="var(--accent-bg)"/>'
    : '<rect x="' + L + '" y="' + (y0 - 5) + '" width="' + Math.max(0, kx - L) + '" height="10" rx="5" fill="var(--accent-bg)"/>';
  g += '<line x1="' + L + '" x2="' + R + '" y1="' + y0 + '" y2="' + y0 + '" stroke="var(--line)" stroke-width="2"/>';
  g += '<line x1="' + kx + '" x2="' + kx + '" y1="14" y2="136" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  g += '<text x="' + Math.min(W - 70, Math.max(70, kx)) + '" y="11" text-anchor="middle" style="fill:var(--accent)">Strike ' + money(s.strike) + (kind === 'call' ? ' (pays above)' : ' (pays below)') + '</text>';
  const sorted = pts.slice().sort((p, q) => p.x - q.x);
  const rows = [[34, 'up'], [56, 'up'], [104, 'dn'], [126, 'dn']];   // label heights
  const lastEdge = [-1e9, -1e9, -1e9, -1e9];
  const order = [1, 2, 0, 3];                                       // prefer the rows nearest the line
  sorted.forEach(p => {
    const x = X(p.x);
    const label = p.name + ' ' + money(p.x);
    const w = label.length * 6.6 + 10;
    let left = Math.max(2, Math.min(W - w - 2, x - w / 2));
    let row = order.find(r => left > lastEdge[r] + 6);
    if (row === undefined) row = order.reduce((m, r) => lastEdge[r] < lastEdge[m] ? r : m, 0);
    lastEdge[row] = left + w;
    const ty = rows[row][0];
    g += '<line x1="' + x + '" x2="' + x + '" y1="' + (rows[row][1] === 'up' ? ty + 4 : ty - 12) + '" y2="' + y0 + '" stroke="' + p.col + '" stroke-width="1" opacity=".45"/>';
    g += '<circle cx="' + x + '" cy="' + y0 + '" r="6" fill="' + p.col + '" stroke="var(--surface)" stroke-width="2"/>';
    g += '<text x="' + (left + w / 2) + '" y="' + ty + '" text-anchor="middle"><tspan>' + p.name + ' </tspan><tspan class="v">' + money(p.x) + '</tspan></text>';
  });
  return g + '</svg>';
}

/* ---------- Live news and prices (need the local server) ---------- */
function paintNews(d){
  const box = $('newscard'), s = STATE[d.id];
  if (!box) return;
  const head = '<h3>News</h3>';
  if (!STATUS.server || !d.ticker || d.source === 'sample'){
    box.innerHTML = head + '<p class="sub">' + (d.source === 'sample' ? 'No news. This company is made up.' :
      !d.ticker ? 'This filing has no ticker, so there is no feed to read.' : 'Needs the local server.') + '</p>';
    return;
  }
  if (s.news){ renderNews(d, s.news); return; }
  box.innerHTML = head + '<p class="sub">Reading headlines...</p>';
  const q = '/api/news?ticker=' + encodeURIComponent(d.ticker) + '&name=' + encodeURIComponent(d.target) + '&acquirer=' + encodeURIComponent(d.acquirer || '');
  getJson(q, 20000).then(res => { s.news = res; if (SELECTED === d.id) { applyNews(d); renderNews(d, res); } })
    .catch(() => { box.innerHTML = head + '<p class="sub">Yahoo headlines timed out or did not answer. The filing and the stock quote are unchanged.</p>'; });
}
function applyNews(d){
  const s = STATE[d.id], r = s.news;
  if (!r || r.error) return;
  s.newsAdj = r.adjustment || 0;
  if (!s.pCloseManual && s.pBase > 0 && s.pBase < 1){
    s.pClose = Math.min(0.995, Math.max(0.01, sigm(logit(s.pBase) + s.newsAdj)));
    syncInputs(); paint(); paintList();
  }
}
function scoreLabel(h){
  if (!h || h.scored === false || h.weight === null || h.weight === undefined || !isFinite(+h.weight)) return 'Not scored';
  const n = +h.weight;
  if (n === 0) return '0.0';
  return (n > 0 ? '+' : '') + n.toFixed(1);
}
function renderNews(d, r){
  const s = STATE[d.id], box = $('newscard');
  const head = '<h3>News</h3>';
  if (r.error){ box.innerHTML = head + '<p class="sub">' + esc(r.error) + '</p>'; return; }
  let flags = '';
  if (r.flags && r.flags.ended) flags += '<div class="notice err">A headline suggests this deal may have ended. Confirm in the filings before trading.</div>';
  if (r.flags && r.flags.completed) flags += '<div class="notice">A headline suggests the deal has completed. The option may no longer be a deal option.</div>';
  if (r.flags && r.flags.rivalBid) flags += '<div class="notice">A headline mentions a rival or higher bid. If it is real, raise "Extra pop above the offer".</div>';
  const items = (r.headlines || []).map(h => '<li><span class="dl ' + (h.weight > 0 ? 'up' : h.weight < 0 ? 'down' : 'zero') + '">' + scoreLabel(h) + '</span><div>' +
    (h.link ? '<a href="' + esc(h.link) + '" target="_blank" rel="noopener">' + esc(h.title) + '</a>' : esc(h.title)) +
    '<small>' + (h.age_days != null ? h.age_days + ' days ago' : '') + (h.tags.length ? ' &middot; ' + esc(h.tags.join(', ')) : '') + '</small></div></li>').join('');
  const moved = s.pBase !== null ? ' Close odds started at ' + pct(s.pBase, 1) + ' from the filing and are ' + pct(sigm(logit(s.pBase) + (r.adjustment || 0)), 1) + ' after the news.' : '';
  box.innerHTML = head + flags + '<p class="sub">' + (r.headlines && r.headlines.length ? 'Headlines about the deal, newest first. The score is in log-odds points; recent headlines count more.' + moved : 'No headlines about a deal or regulators were found for this ticker.') +
    ' The weights are hand-set judgments, not a trained model. 0.0 means a headline was scored and no rule matched. Not scored means the score is missing.' + (s.pCloseManual ? ' You moved the odds slider yourself, so the news is shown but not applied.' : '') + '</p>' +
    (items ? '<ul class="drv">' + items + '</ul>' : '');
}
async function pullMarket(d){
  const s = STATE[d.id], note = $('mktNote'), btn = $('mktBtn');
  btn.disabled = true; note.textContent = 'Reading Yahoo Finance...';
  const q = '/api/market?ticker=' + encodeURIComponent(d.ticker) + '&filedOn=' + encodeURIComponent(d.filedOn || '') + '&kind=' + s.kind + '&strike=' + (s.strike || '') + '&days=' + (s.days || 60);
  try{
    const r = await getJson(q, 30000);
    if (r.error){ note.textContent = r.error; return; }
    const got = [];
    const fill = (k, v, label) => { if (v !== null && v !== undefined && isFinite(v) && v > 0){ s[k] = v; got.push(label); const el = $('f_' + k); if (el) el.classList.remove('assumed'); } };
    fill('spot', r.spot, 'price'); fill('downside', r.downside, 'pre-announcement price'); fill('vol', r.vol, 'volatility');
    if (r.option){ fill('strike', r.option.strike, 'strike'); fill('days', r.option.days, 'expiry'); fill('premium', r.option.premium, 'premium'); }
    if (!s.resolveManual) s.resolve = autoResolve(s);
    syncInputs(); paint(); paintList();
    note.textContent = 'Filled ' + (got.join(', ') || 'nothing') + ' from the delayed Yahoo chart, bar date ' + (r.asOf || 'unknown') + '. Not a real-time quote.' + (r.option ? '' : ' ' + (r.optionNote || ''));
  }catch(e){ note.textContent = 'Could not reach Yahoo Finance.'; }
  finally{ btn.disabled = false; }
}

/* ---------- Agent read ---------- */
function paintAgent(d){
  const flags = d.flags || {};
  const chips = [];
  if (flags.hsr) chips.push('US antitrust review (HSR)');
  if (flags.secondRequest) chips.push('Second request');
  (flags.foreign || []).forEach(x => chips.push(x));
  (flags.other || []).forEach(x => chips.push(x));
  if (flags.financingCondition === true) chips.push('Financing condition');
  if (flags.financingCondition === false) chips.push('No financing condition');
  if (flags.tender) chips.push('Tender offer');
  if (flags.vote) chips.push('Shareholder vote');
  if (flags.goShop) chips.push('Go-shop');
  (flags.termFees || []).forEach(x => chips.push('Break fee ' + x));
  const drivers = (d.drivers || []).map(x => {
    const cls = x.delta > 0 ? 'up' : x.delta < 0 ? 'down' : 'zero';
    const txt = x.delta === 0 ? 'start' : (x.delta > 0 ? '+' : '-') + Math.abs(x.delta * 100).toFixed(0) + ' pts';
    return '<li><span class="dl ' + cls + '">' + txt + '</span><div>' + esc(x.label) + (x.note ? '<small>' + esc(x.note) + '</small>' : '') + '</div></li>';
  }).join('');
  const ev = d.evidence || {};
  const quotes = Object.keys(ev).map(k => '<blockquote>' + esc(ev[k]) + '</blockquote>').join('');
  const how = {sample:'Sample data', rules:'Read with text rules', llm:'Read by a Claude model'}[d.extraction] || '';
  const M = STATUS.model;
  const src = d.pSource === 'model' && M
    ? 'The close odds come from a model trained on ' + M.n.toLocaleString() + ' past deals (' + M.from.slice(0, 4) + ' to ' + M.to.slice(0, 4) + '). On the newest deals it had never seen, its Brier score was ' + M.brier.toFixed(3) + ', against ' + M.baseBrier.toFixed(3) + ' for always guessing the historical close rate and ' + M.rulesBrier.toFixed(3) + ' for the old hand-written rules (lower is better).'
    : 'The close odds come from hand-written rules, not a trained model. Train one with the scripts in the training folder.';

  const box = $('more');
  if (!box) return;
  box.innerHTML = '<details><summary>Where the numbers came from</summary>' +
    '<p class="sub">' + esc(how) + '. ' + esc(src) + '</p>' +
    (chips.length ? '<div class="chips">' + chips.map(c => '<span class="chip">' + esc(c) + '</span>').join('') + '</div>' : '') +
    quotes + (d.closePhrase ? '<blockquote>' + esc(d.closePhrase) + '</blockquote>' : '') +
    '</details>';
}

/* ---------- Loading ---------- */
function takeServerPrices(d){
  const s = STATE[d.id];
  if (!s){ STATE[d.id] = initState(d); return; }
  if (!s.spotEdited && d.market) s.spot = d.market.spot;
  if (!s.downEdited && d.market) s.downside = d.market.downside;
  if (!s.offerEdited) s.offer = d.offer;
}
function setDeals(list){
  const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#detail');
  const keepOpen = editing && SELECTED;
  DEALS = list;
  DEALS.forEach(takeServerPrices);
  if (!shownDeal(DEALS.find(d => d.id === SELECTED))){
    let best = null, gap = -1, ready = null, spread = -1;
    DEALS.forEach(d => {
      if (!shownDeal(d)) return;
      const s = STATE[d.id], q = stockQuote(s);
      const w = Math.abs(s.spot - s.downside);
      if (w > spread){ ready = d.id; spread = w; }
      if (q.action === 'pass') return;
      const g = Math.abs(q.value - s.spot);
      if (g > gap){ best = d.id; gap = g; }
    });
    const visible = DEALS.filter(shownDeal);
    SELECTED = best || ready || (visible[0] && visible[0].id) || null;
  }
  paintList();
  if (SELECTED && !keepOpen) select(SELECTED);
  else if (SELECTED) paint();
  else $('detail').innerHTML = '<div class="card empty">' + (SCAN_ERROR || 'No filings to show.') + '</div>';
}
function showScanError(msg){
  if (DEALS.length){
    note(msg, true);
    paintList();
    return;
  }
  SCAN_ERROR = msg;
  DEALS = [];
  SELECTED = null;
  paintList();
  $('detail').innerHTML = '<div class="card"><h2>Filings are unavailable</h2><p>' + esc(msg) + '</p><p class="sub">No practice companies are substituted.</p></div>';
}
async function getJson(url, ms){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(url, {signal:ctl.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function scan(refresh){
  const btn = $('scanBtn');
  btn.disabled = true; btn.textContent = 'Scanning...';
  try{
    const res = await getJson('/api/scan' + (refresh ? '?refresh=1' : ''), 120000);
    STATUS.mode = res.mode;
    APPLIED_SCAN = res.scannedAt || APPLIED_SCAN;
    if (res.mode === 'live' && res.deals && res.deals.length){
      SCAN_ERROR = null; setDeals(res.deals);
      if (res.warnings && res.warnings.length) note(res.warnings.join(' '), true);
    }
    else if (res.mode === 'live'){ showScanError('EDGAR returned no merger filings in this window.'); }
    else { showScanError(res.reason || 'The SEC filing search failed. Earlier filings stay on screen.'); }
    pollStatus();
  }catch(e){
    const timed = e && e.name === 'AbortError';
    showScanError(timed
      ? 'The SEC scan timed out in the browser. Earlier filings stay on screen, and no prices were filled in.'
      : 'The local server did not answer. Earlier filings stay on screen. Run python3 server.py and open http://127.0.0.1:8000.');
  }finally{
    btn.disabled = false; btn.textContent = 'Scan filings'; paintPills();
  }
}
function note(msg, err){
  const el = document.createElement('div');
  el.className = 'notice' + (err ? ' err' : '');
  el.textContent = msg;
  const det = $('detail');
  det.insertBefore(el, det.firstChild);
  setTimeout(() => el.remove(), 12000);
}

(async function start(){
  paintList();
  $('detail').innerHTML = '<div class="card empty">Reading SEC filings…</div>';
  paintPills();
  $('scanBtn').addEventListener('click', () => scan(true));
  try{
    const st = await getJson('/api/status', 2500);
    STATUS = Object.assign(STATUS, st, {server:true});
    paintPills();
    paintStatus();
    await scan(false);
    setInterval(pollStatus, 60000);
  }catch(e){
    showScanError('The local server did not answer. Run python3 server.py and open http://127.0.0.1:8000.');
    paintPills();
  }
})();
</script>
